name: Import Relationship AI Test

on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unpack project files
        run: |
          tar -xzf relationship-project-ai-source.tar.gz
          rm relationship-project-ai-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Relationship AI Test project files"
          git push
